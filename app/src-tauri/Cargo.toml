[package]
name = "pulse-app"
version = "0.1.0"
edition = "2021"
[lib]
name = "pulse_app_lib"
crate-type = ["rlib"]
[[bin]]
name = "pulse-app"
path = "src/main.rs"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
pulse-protocol = { path = "../../crates/pulse-protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry"] }
[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
