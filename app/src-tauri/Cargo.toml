[package]
name = "pulse-app"
version = "0.1.0"
edition = "2021"
[lib]
name = "pulse_app_lib"
crate-type = ["rlib"]
[[bin]]
name = "pulse-app"
path = "src/main.rs"
[features]
# Empaqueta el frontend (dist/) en el .exe. Sin ella, la app carga devUrl (localhost:5173). `tauri build` la activa sola; install.ps1 la pasa a mano.
custom-protocol = ["tauri/custom-protocol"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
pulse-protocol = { path = "../../crates/pulse-protocol" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
rodio = { version = "0.19", default-features = false, features = ["wav"] }
dirs = "5"
ureq = { version = "2", features = ["json"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_Time", "Win32_System_SystemInformation"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "linux")'.dependencies]
# La misma versión que usa Tauri: da acceso a la ventana GTK (región de entrada de la isla).
gtk = "0.18"
gdkx11 = "0.18"
# Xlib para quitarles a los bordes el protocolo WM_TAKE_FOCUS (GNOME los enfocaría). Ya viene con gdkx11; "xlib" lo enlaza.
x11 = { version = "2.21", features = ["xlib"] }
[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
