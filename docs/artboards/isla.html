<title>Isla: Hilo, Orbe y Comando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<style>
/* Layout: tres recortes a tamaño real (parte de arriba del monitor), uno por dirección, a todo lo ancho. Barra de eventos fija arriba y ajustes compartidos al final. Tema oscuro único: es un banco de luz. */
:root{
  color-scheme: dark;
  --bg:#0a0b0d; --panel:#121418; --line:#22262c; --line-2:#30353d; --fg:#e7e9ec; --muted:#8e95a0; --faint:#5d646e; --focus:#a9c8ff; --ink:#060708;
  --work:#e8eefc; --perm:#ffb02e; --done:#4fe0a0; --idle:#b6c0d4; --err:#ff5a52; --sub:#5cc8ff; --moon:#b9a2ff;
  --glass:rgba(16,17,21,.78);
  --f-ui:"Geist", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --e-out:cubic-bezier(.16,1,.3,1); --e-in:cubic-bezier(.7,0,.84,0);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
::selection{background:#2b3a52;color:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:"liga";display:inline-block;overflow:hidden;width:1em;flex:none;font-size:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.page{max-width:1240px;margin-inline:auto;padding-inline:22px;padding-block:0 60px}
.head{padding-block:26px 6px}
.head h1{margin:0 0 4px;font-size:21px;font-weight:600;letter-spacing:-.01em}
.head p{margin:0;color:var(--muted);max-width:78ch;text-wrap:pretty}
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:10px;background:linear-gradient(var(--bg) 80%,transparent)}
.cb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:#171a1e;padding:5px 11px;border-radius:99px;font-size:12.5px;white-space:nowrap;transition:background .15s,transform .1s,border-color .15s}
.cb:hover{background:#1f2328}
.cb:active{transform:scale(.97)}
.cb i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cb .ms{font-size:15px}
.cb[aria-pressed="true"]{border-color:var(--fg)}
.cb.pri{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:500}
.cb .prog{width:34px;height:3px;background:rgba(0,0,0,.2);border-radius:2px;overflow:hidden}
.cb .prog b{display:block;height:100%;width:0;background:var(--ink)}
.sep{width:1px;height:20px;background:var(--line)}
.dirs{display:grid;gap:40px;margin-top:12px}
.dh{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.dh h2{margin:0;font-size:17px;font-weight:600}
.dh p{margin:3px 0 0;color:var(--muted);max-width:80ch;font-size:13.5px;text-wrap:pretty}
.dh .try{margin-top:6px;font-size:12.5px;color:#c4c9d0}
.dh .try b{color:#fff;font-weight:500}
.pick{border:1px solid var(--line-2);background:#171a1e;border-radius:8px;padding:7px 14px;font-size:13px}
.pick[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:500}
.board{position:relative;height:340px;border-radius:12px;overflow:hidden;border:1px solid var(--line);isolation:isolate;user-select:none}
.board.chosen{border-color:#59606b}
.wp-dark{background:radial-gradient(55% 120% at 10% 130%,#1b2738 0%,transparent 60%),radial-gradient(45% 100% at 92% -30%,#261f33 0%,transparent 60%),#0d1015}
.wp-light{background:radial-gradient(55% 120% at 10% 130%,#cdd8e6 0%,transparent 60%),radial-gradient(45% 100% at 92% -30%,#e5dccf 0%,transparent 60%),#eef0f3}
.wp-code{background:repeating-linear-gradient(to bottom,transparent 0 21px,rgba(255,255,255,.028) 21px 22px),#1e1f22}
.bezel{position:absolute;z-index:3;left:0;right:0;top:0;height:7px;background:#050506;box-shadow:0 1px 0 rgba(255,255,255,.035)}
.beam{position:absolute;z-index:4;left:0;right:0;top:7px;height:60px;pointer-events:none;opacity:0}
.tweaks{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:12px;align-content:start}
.tw h3{margin:0;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:5px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#1c1f24;color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
.tg small{display:block;color:var(--muted);font-size:12px}
.sw{position:relative;width:32px;height:19px;flex:none;appearance:none;-webkit-appearance:none;background:#2a3038;border-radius:99px;margin:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#e5e8ec;transition:transform .24s cubic-bezier(.3,1.5,.5,1)}
.sw:checked{background:#5d8bd6}
.sw:checked::after{transform:translateX(13px)}
.fh{display:flex;justify-content:space-between;font-size:13px}
.fh output{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--fg)}
.choice{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.choice p{margin:0;color:var(--muted);font-size:13px;flex:1;min-width:260px}

/* ---------- shared island pieces ---------- */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.06),0 18px 40px -18px rgba(0,0,0,.75)}
.wp-light .glass{box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(255,255,255,.07),0 18px 40px -20px rgba(30,40,60,.45)}
.shell{position:absolute;z-index:6;overflow:hidden;color:#eceef1;font-size:13px;line-height:1.35}
.layer{position:absolute;left:0;top:0;width:max-content;max-width:520px}
.row{display:flex;align-items:center;gap:10px;white-space:nowrap}
.muted{color:#9aa1ab}
.t b{font-weight:500}
.card{padding:13px 15px 14px;display:grid;gap:10px;min-width:310px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12.5px}
.ch .nm{font-family:var(--f-mono);font-size:12px;color:#c7ccd3}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--c)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.cmd{font-family:var(--f-mono);font-size:12.5px;color:#ffd590;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.05);border-radius:8px;padding:8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
.warn{display:flex;align-items:center;gap:6px;font-size:12px;color:#ffc56a}
.warn .ms{font-size:15px}
.acts{display:flex;gap:8px}
.acts button{position:relative;flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:500;overflow:hidden;transition:transform .12s var(--e-out),background .15s}
.acts button:active{transform:scale(.96)}
.b-no{background:rgba(255,255,255,.07);color:#e3e6ea}
.b-no:hover{background:rgba(255,255,255,.12)}
.b-yes{background:#eef0f3;color:#0b0d10}
.b-yes:hover{background:#fff}
.b-yes .fill{position:absolute;inset:0;background:var(--perm);transform-origin:left;transform:scaleX(var(--hold,0))}
.b-yes span,.b-yes kbd{position:relative}
kbd{font-family:var(--f-mono);font-size:10.5px;font-weight:400;padding:0 5px;min-width:18px;text-align:center;border-radius:4px;border:1px solid currentColor;opacity:.5;transition:opacity .12s,transform .12s,background .12s;display:inline-block;line-height:16px}
kbd.on{opacity:1;background:rgba(255,255,255,.22);transform:translateY(1px)}
.cd{position:absolute;left:15px;right:15px;bottom:0;height:1.5px;border-radius:2px;background:linear-gradient(90deg,var(--perm),rgba(255,176,46,.4));transform-origin:left}
.meta{display:flex;gap:14px;font-family:var(--f-mono);font-size:11.5px;color:#8a919b}
.mini{display:flex;gap:6px}
.mini button{border:0;background:rgba(255,255,255,.07);border-radius:7px;padding:4px 9px;font-size:12px;color:#dde1e6;display:inline-flex;gap:5px;align-items:center;transition:background .15s,transform .1s}
.mini button:hover{background:rgba(255,255,255,.13)}
.mini button:active{transform:scale(.96)}
.mini .ms{font-size:14px}
.ok{color:var(--done)}.bad{color:#ff8c84}
.draw{clip-path:inset(0 100% 0 0);animation:draw .5s var(--e-out) .08s forwards}
@keyframes draw{to{clip-path:inset(0 0 0 0)}}

/* ---------- Hilo ---------- */
.h-line{position:absolute;z-index:6;top:7px;display:flex;gap:6px;transition:opacity .4s}
.h-seg{position:relative;height:2px;width:44px;border-radius:0 0 2px 2px;background:var(--c,#cfd5de);opacity:.3;cursor:pointer;transition:width .6s var(--sp),opacity .4s,background .5s,box-shadow .5s,height .25s var(--e-out)}
.h-seg::before{content:"";position:absolute;left:-3px;right:-3px;top:-7px;height:22px}
.h-seg.on{opacity:1;box-shadow:0 0 6px 0 color-mix(in srgb,var(--c) 70%,transparent),0 0 18px 1px color-mix(in srgb,var(--c) 30%,transparent)}
.h-seg:hover,.h-seg.hov{height:3px}
.h-seg.wait{width:96px;animation:hb 1.6s ease-in-out infinite}
@keyframes hb{0%,100%{filter:brightness(1)}12%{filter:brightness(1.9)}26%{filter:brightness(1)}38%{filter:brightness(1.6)}}
.h-seg.idlew{animation:br 3s ease-in-out infinite}
@keyframes br{50%{opacity:.55}}
.h-bead{position:absolute;top:0;bottom:0;width:16px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff,transparent);opacity:0}
.h-seg.work .h-bead{opacity:.95;animation:bead 1.7s cubic-bezier(.45,0,.2,1) infinite}
@keyframes bead{from{left:-16px}to{left:100%}}
.wp-light .h-seg:not(.on){--c:#39414d}
.h-thread{position:absolute;z-index:5;top:9px;width:1px;height:14px;background:linear-gradient(var(--tc,#cfd5de),color-mix(in srgb,var(--tc,#cfd5de) 30%,transparent));transform-origin:top;transform:scaleY(0);transition:transform .28s var(--e-out),left .55s var(--sp),background .4s}
.h-thread.on{transform:scaleY(1)}
.h-card{top:23px;transition:left .55s var(--sp)}
.h-card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--tc,#cfd5de),transparent);opacity:.7;z-index:2}

/* ---------- Orbe ---------- */
.o-shell{top:13px;border-radius:99px;cursor:pointer;touch-action:none}
.o-shell.right{right:16px}.o-shell.left{left:16px}.o-shell.center{left:50%;translate:-50% 0}
.o-shell.drag{cursor:grabbing}
.o-shell[data-k="dot"]{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.o-core{position:relative;width:22px;height:22px;display:grid;place-items:center}
.o-orbit{position:absolute;inset:0;opacity:0;transition:opacity .4s}
.o-orbit i{position:absolute;top:2px;left:50%;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--c);opacity:.8}
.o-core.work .o-orbit{opacity:1;animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.o-dot{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);transition:background .4s,box-shadow .4s,transform .4s var(--e-out)}
.o-core.wait .o-dot{animation:obr 1.6s ease-in-out infinite}
@keyframes obr{0%,100%{transform:scale(1)}15%{transform:scale(1.7)}30%{transform:scale(1)}45%{transform:scale(1.45)}}
.o-rest{width:10px;height:10px;display:grid;place-items:center}
.o-rest i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
.wp-light .o-rest i{background:rgba(0,0,0,.3)}
.o-peek{display:flex;align-items:center;gap:8px;padding:0 13px 0 4px;height:28px;font-size:12.5px}
.o-sd{display:flex;gap:4px}
.o-sd i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.o-menu{display:flex;align-items:center;gap:0;padding:0 4px;height:28px}
.o-menu button{border:0;background:transparent;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;color:#d9dde2;position:relative;transition:background .15s,transform .12s}
.o-menu button:hover{background:rgba(255,255,255,.1)}
.o-menu button:active{transform:scale(.9)}
.o-menu button .ms{font-size:15px}
.o-menu button[aria-pressed="true"]{color:var(--moon)}
.o-tip{position:absolute;z-index:8;top:46px;font-size:11.5px;color:#e9ecef;background:rgba(10,11,13,.9);padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s,transform .2s var(--e-out);transform:translateY(-3px)}
.o-tip.on{opacity:1;transform:none}
.o-pill{display:flex;align-items:center;gap:8px;padding:0 14px 0 4px;height:28px;font-size:12.5px}

/* ---------- Comando ---------- */
.c-zone{position:absolute;z-index:5;top:0;left:50%;translate:-50% 0;width:420px;height:34px}
.c-hint{position:absolute;z-index:6;top:12px;left:50%;translate:-50% 0;display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.5);padding:4px 10px;border-radius:99px;border:0;background:rgba(255,255,255,.05);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .35s var(--e-out),background .2s;pointer-events:none}
.c-hint .ms{font-size:14px}
.c-zone:hover + .c-hint,.c-hint:hover,.c-hint.show{opacity:1;transform:none;pointer-events:auto}
.c-hint:hover{background:rgba(255,255,255,.1);color:#fff}
.wp-light .c-hint{color:rgba(0,0,0,.5);background:rgba(0,0,0,.05)}
.c-shell{top:12px;left:50%;translate:-50% 0;border-radius:14px}
.c-toast{display:flex;align-items:center;gap:10px;padding:8px 14px;height:36px;white-space:nowrap;position:relative}
.c-toast .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.c-toast .ic .ms{font-size:15px}
.c-toast .tm{position:absolute;left:14px;right:14px;bottom:0;height:1px;background:rgba(255,255,255,.35);transform-origin:left}
.pal{width:520px;display:grid}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.pal-in .ms{font-size:18px;color:#8b929c}
.pal-in input{flex:1;background:transparent;border:0;outline:0;color:#f2f4f6;font-size:15px}
.pal-in input::placeholder{color:#727a85}
.pal-in .pre{font-size:12px;color:#c7ccd3;background:rgba(255,255,255,.08);border-radius:6px;padding:2px 8px;white-space:nowrap}
.pal-list{position:relative;max-height:186px;overflow:auto;padding:6px}
.pal-hl{position:absolute;left:6px;right:6px;top:0;height:34px;border-radius:8px;background:rgba(255,255,255,.075);transition:transform .32s var(--sp),height .2s;pointer-events:none}
.pal-g{font-size:11px;color:#757d88;padding:8px 10px 4px}
.pal-it{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;height:34px;padding:0 10px;border-radius:8px;font-size:13px;white-space:nowrap;cursor:pointer}
.pal-it .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,#9aa1ab) 16%,transparent);color:var(--c,#c7ccd3)}
.pal-it .ic .ms{font-size:15px}
.pal-it span{overflow:hidden;text-overflow:ellipsis;color:#d9dde2}
.pal-it span u{text-decoration:none;color:#fff;font-weight:500}
.pal-it small{font-family:var(--f-mono);font-size:11px;color:#7a828d}
.pal-it[aria-selected="true"] small{color:#c7ccd3}
.pal-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:11.5px;color:#7a828d}
.pal-foot kbd{opacity:.7;margin-right:4px}
.pal-empty{padding:14px 10px;color:#7a828d;font-size:13px}

@media (prefers-reduced-motion:reduce){
  .h-seg.wait,.h-seg.idlew,.h-seg.work .h-bead,.o-core.work .cmt,.o-core.wait .o-dot{animation:none}
  .draw{animation:none;clip-path:none}
}
</style>

<div class="page">
  <header class="head">
    <h1>Isla: Hilo, Orbe y Comando</h1>
    <p>Las tres que elegiste, rehechas con más cuidado. Cada recorte es la parte de arriba de tu monitor a tamaño real y todas reaccionan a los mismos eventos. Prueba la interacción de cada una (está indicada arriba de cada recuadro).</p>
  </header>
  <div class="bar" id="bar"></div>
  <div class="dirs" id="dirs"></div>
  <div class="tweaks" id="tweaks"></div>
  <div class="choice"><p id="choiceTxt"></p><button class="pick" type="button" data-act="copy">Copiar para Claude</button><span class="mono" id="copyNote" style="font-size:12px;color:var(--faint)"></span></div>
</div>

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rgb = h => { const n = parseInt(h.slice(1), 16); return [n>>16&255, n>>8&255, n&255]; };
const rgba = (h, a) => `rgba(${rgb(h).join(',')},${a})`;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
try { CSS.registerProperty({name:'--p', syntax:'<percentage>', inherits:false, initialValue:'0%'}); } catch {}

const KEY = 'pulse-isla-v3';
let TW = {rest:'line', speed:1, wall:'dark', keys:true, hold:true, countdown:true, timeout:30, beam:true, chosen:null, sel:'s1'};
try { TW = {...TW, ...JSON.parse(localStorage.getItem(KEY) || '{}')}; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(TW)); } catch {} };
const T = ms => ms / TW.speed;

/* spring easing via linear() */
const hasLinear = CSS.supports('transition-timing-function', 'linear(0, 1)');
function spring(k, d) {
  if (!hasLinear) return {e:'cubic-bezier(.32,.72,0,1)', d:520};
  let x = 0, v = 0; const dt = 1 / 120, pts = [0];
  for (let i = 0; i < 480; i++) { const a = -k * (x - 1) - d * v; v += a * dt; x += v * dt; if (i % 2) pts.push(+x.toFixed(4)); if (i > 30 && Math.abs(1 - x) < .0015 && Math.abs(v) < .01) break; }
  pts.push(1); return {e:`linear(${pts.join(',')})`, d:Math.round(pts.length * 2 * dt * 1000)};
}
const SP_OPEN = spring(260, 23), SP_CLOSE = spring(340, 38), SP_MOVE = spring(200, 24);
document.documentElement.style.setProperty('--sp', SP_MOVE.e);

/* ================= model ================= */
const COL = {working:'#e8eefc', waiting:'#ffb02e', done:'#4fe0a0', idlewait:'#b6c0d4', idle:'#69717c'};
const LBL = {working:'trabajando', waiting:'pide permiso', done:'terminó', idlewait:'te espera', idle:'en calma'};
const SESS = [{id:'s1', name:'hyperflow-app'},{id:'s2', name:'proppie-api'},{id:'s3', name:'mcrefacciones'}].map(s => ({...s, state:'idle', last:'', subs:0, since:Date.now(), actions:0, muted:false}));
const S = id => SESS.find(s => s.id === id);
const M = {queue:[], focus:false, deferred:[], tr:null};

['pointerup','pointercancel'].forEach(t => document.addEventListener(t, holdEnd));
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.altKey && (e.code === 'Space' || e.key === ' ')) { e.preventDefault(); comps.find(c => c.key === 'comando')?.open(); return; }
  if (e.target.matches('input, textarea')) return;
  const k = e.key.toLowerCase();
  if (M.queue.length && TW.keys && !e.repeat) {
    if (k === 'y') { e.preventDefault(); press('y'); if (danger()) { $$('kbd[data-k="y"]').forEach(x => x.classList.add('on')); holdBegin(); } else resolve(true); }
    if (k === 'n') { e.preventDefault(); press('n'); resolve(false); }
    if (k === 'enter') { e.preventDefault(); comps.find(c => c.key === 'comando')?.open(); }
  }
});
document.addEventListener('keyup', e => { if (e.key.toLowerCase() === 'y') { $$('kbd[data-k="y"]').forEach(x => x.classList.remove('on')); holdEnd(); } });
window.addEventListener('resize', () => renderAll());

buildPage();
const demo = new URLSearchParams(location.search).get('demo');
if (demo === 'perm') setTimeout(() => { emit('start', 's1', 'Edit Header.tsx'); emit('permission', 's2', {cmd:'npx prisma migrate dev'}); }, 60);
if (demo === 'work') setTimeout(() => { emit('start', 's1', 'Edit Header.tsx'); emit('start', 's2', 'Endpoint de reservas'); }, 60);
if (demo === 'pal') setTimeout(() => { emit('idle', 's3'); emit('permission', 's2', {cmd:'npx prisma migrate dev'}); setTimeout(() => comps[2].open(), 700); }, 60);
})();
